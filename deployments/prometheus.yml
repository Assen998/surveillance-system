global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'surveillance'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 监控应用
  - job_name: 'surveillance'
    static_configs:
      - targets: ['surveillance:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter (宿主机指标)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # cAdvisor (容器指标)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']

  # Redis 监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Nginx 监控
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']

  # MinIO 监控
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']